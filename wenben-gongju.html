<body>
<div class="header">
  <h1>文本工具箱</h1>
  <p>字数统计、大小写转换、去重、反转——即输即用,全部在本地完成,不上传服务器</p>
</div>

<div class="container">

  <div class="card">
    <h2>📊 字数统计</h2>
    <div class="desc">输入文字,自动统计汉字数、字符数、单词数等,实时更新</div>
    <textarea id="countInput" placeholder="在这里粘贴或输入文字…" oninput="countText()"></textarea>
    <div class="stat-row">
      <div class="stat"><div class="num" id="sHan">0</div><div class="txt">汉字</div></div>
      <div class="stat"><div class="num" id="sChar">0</div><div class="txt">字符(不含空格)</div></div>
      <div class="stat"><div class="num" id="sAll">0</div><div class="txt">总字符</div></div>
      <div class="stat"><div class="num" id="sWord">0</div><div class="txt">单词/词数</div></div>
      <div class="stat"><div class="num" id="sLine">0</div><div class="txt">行数</div></div>
    </div>
  </div>

  <div class="card">
    <h2>🔠 大小写转换</h2>
    <div class="desc">全大写 / 全小写 / 首字母大写,一键转换</div>
    <textarea id="caseInput" placeholder="输入英文文本…"></textarea>
    <button class="btn" onclick="conv('upper')">全部大写</button>
    <button class="btn" onclick="conv('lower')">全部小写</button>
    <button class="btn" onclick="conv('title')">首字母大写</button>
    <textarea id="caseOutput" placeholder="转换结果会显示在这里…" readonly></textarea>
  </div>

  <div class="card">
    <h2>🧹 按行去重并排序</h2>
    <div class="desc">每行一条内容,一键去掉重复行并排序(适合整理名单、关键词)</div>
    <textarea id="dedupeInput" placeholder="每行一条,例如:&#10;苹果&#10;香蕉&#10;苹果"></textarea>
    <button class="btn" onclick="dedupe()">去重并排序</button>
    <textarea id="dedupeOutput" placeholder="结果会显示在这里…" readonly></textarea>
  </div>

  <div class="card">
    <h2>🔄 文本反转</h2>
    <div class="desc">整段文字反转 / 每行分别反转</div>
    <textarea id="revInput" placeholder="输入要反转的文字…"></textarea>
    <button class="btn" onclick="rev('all')">整段反转</button>
    <button class="btn" onclick="rev('line')">每行反转</button>
    <textarea id="revOutput" placeholder="结果会显示在这里…" readonly></textarea>
  </div>

  <div class="card tip">
    💡 说明:所有文本处理都在<b>你的浏览器本地</b>完成,不会上传到任何服务器,可以放心粘贴隐私内容。
  </div>

<div class="footer">文本工具箱 · 免费使用</div>

<script>
function countText() {
  var t = document.getElementById("countInput").value;
  var han = (t.match(/[\u4e00-\u9fa5]/g) || []).length;
  var noSpace = t.replace(/\s/g, "").length;
  var all = t.length;
  var words = (t.match(/[a-zA-Z0-9]+|[\u4e00-\u9fa5]/g) || []).length;
  var lines = t === "" ? 0 : t.split("\n").length;
  document.getElementById("sHan").textContent = han;
  document.getElementById("sChar").textContent = noSpace;
  document.getElementById("sAll").textContent = all;
  document.getElementById("sWord").textContent = words;
  document.getElementById("sLine").textContent = lines;
}

function conv(mode) {
  var t = document.getElementById("caseInput").value;
  var out;
  if (mode === "upper") out = t.toUpperCase();
  else if (mode === "lower") out = t.toLowerCase();
  else out = t.replace(/\b[a-zA-Z]/g, function (c) { return c.toUpperCase(); });
  document.getElementById("caseOutput").value = out;
}

function dedupe() {
  var lines = document.getElementById("dedupeInput").value.split("\n");
  var seen = {}, result = [];
  lines.forEach(function (l) {
    var k = l.trim();
    if (k && !seen[k]) { seen[k] = 1; result.push(k); }
  });
  result.sort(function (a, b) { return a.localeCompare(b, "zh"); });
  document.getElementById("dedupeOutput").value = result.join("\n");
}

function rev(mode) {
  var t = document.getElementById("revInput").value;
  var out;
  if (mode === "all") {
    out = t.split("").reverse().join("");
  } else {
    out = t.split("\n").map(function (l) { return l.split("").reverse().join(""); }).join("\n");
  }
  document.getElementById("revOutput").value = out;
}
</script>
