<body>
<div class="glow glow-1"></div>
<div class="glow glow-2"></div>
<div class="container">
  <a class="back" href="index.html">← 返回首页</a>
  <h1>下班<span>倒计时</span></h1>
  <div class="subtitle">距离下班还有多久?今天又赚了多少?</div>

  <div class="glass">
    <div class="set-row">
      <div class="f"><label>上班时间</label><input type="time" id="inTime" value="09:00"></div>
      <div class="f"><label>下班时间</label><input type="time" id="outTime" value="18:00"></div>
      <div class="f"><label>今日日薪(元)</label><input type="number" id="salary" value="200"></div>
    </div>
    <div class="big" id="big">--:--:--</div>
    <div class="state" id="state">加载中…</div>
    <div class="money" id="money">今日已赚:¥ --</div>
    <div class="weekend" id="weekend"></div>
    <div class="btn-row">
      <button class="btn" onclick="share()">🔗 复制分享链接</button>
      <a class="btn" id="posterBtn" href="fenxiang-haibao.html?title=距离%20下班&date=" target="_blank">🖼️ 生成海报</a>
    </div>
  </div>

  <div class="glass tip">
    💡 趣味提示:已赚金额 = 从上班到现在的时长 ÷ 总工作时长 × 日薪,仅供参考娱乐。<br>
    🎉 分享给同事朋友,一起等下班!
  </div>
  <div class="footer">下班倒计时 · 免费使用</div>
</div>

<script>
// 读取 URL 参数
(function () {
  var q = new URLSearchParams(location.search);
  if (q.get("time")) document.getElementById("outTime").value = q.get("time");
  if (q.get("salary")) document.getElementById("salary").value = q.get("salary");
})();

function toMin(v) { var p = v.split(":"); return parseInt(p[0]) * 60 + parseInt(p[1]); }
function pad(n) { return (n < 10 ? "0" : "") + n; }

function tick() {
  var now = new Date();
  var inM = toMin(document.getElementById("inTime").value);
  var outM = toMin(document.getElementById("outTime").value);
  var salary = parseFloat(document.getElementById("salary").value) || 0;
  var nowM = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;

  var big = document.getElementById("big");
  var state = document.getElementById("state");
  var money = document.getElementById("money");

  if (nowM < outM) {
    var diffM = outM - nowM;
    var h = Math.floor(diffM / 60), m = Math.floor(diffM % 60), s = 60 - now.getSeconds();
    if (s === 60) s = 0;
    big.textContent = pad(h) + ":" + pad(m) + ":" + pad(s);
    state.textContent = "距离下班还有";
    big.style.color = "#fbbf24";
  } else {
    big.textContent = "00:00:00";
    state.textContent = "🎉 已下班,摸鱼快乐(或加班中)";
    big.style.color = "#34d399";
  }

  // 已赚金额:从上班到现在的时长 / 总时长 × 日薪
  var earned = 0;
  var totalMin = outM - inM;
  if (totalMin > 0 && nowM > inM && nowM < outM) {
    earned = ((nowM - inM) / totalMin) * salary;
  } else if (nowM >= outM && totalMin > 0) {
    earned = salary;
  }
  money.textContent = "今日已赚:¥ " + (earned > 0 ? earned.toFixed(1) : "0.0");

  // 距离周末
  var wk = document.getElementById("weekend");
  var day = now.getDay(); // 0=周日 6=周六
  var daysToSat = (6 - day + 7) % 7;
  if (daysToSat === 0 && now.getHours() >= 0) daysToSat = 0;
  wk.textContent = daysToSat === 0 ? "今天就是周六,快乐!" : "距离周末还有 " + daysToSat + " 天";
}

setInterval(tick, 1000);
tick();

function share() {
  var base = location.origin + location.pathname.replace(/[^/]*$/, "");
  var url = base + "xiaban-daojishi.html?time=" + encodeURIComponent(document.getElementById("outTime").value) + "&salary=" + encodeURIComponent(document.getElementById("salary").value);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).catch(function () { prompt("复制链接:", url); });
  } else { prompt("复制链接:", url); }
  alert("分享链接已复制!");
}
</script>
