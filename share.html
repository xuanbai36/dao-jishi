<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "347a4947308541afa336d0c5c95ca741"}'></script><!-- End Cloudflare Web Analytics -->
<title>分享的倒计时 - 查看好友分享的倒计时</title>
<meta name="description" content="查看通过链接分享的倒计时:输入标题和日期即可生成专属倒计时页面,可分享给好友。">
<meta name="robots" content="noindex">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    min-height: 100vh; color: #e2e8f0;
    background: linear-gradient(160deg, #0f172a 0%, #1e3a8a 60%, #3b82f6 100%);
    display: flex; flex-direction: column; align-items: center; padding: 60px 16px;
    -webkit-font-smoothing: antialiased;
  }
  .stars { position: fixed; inset: 0; pointer-events: none; }
  .stars span { position: absolute; background: #fff; border-radius: 50%; animation: twinkle 3s ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { opacity: 0.25; } 50% { opacity: 1; } }
  .container { position: relative; z-index: 1; max-width: 520px; width: 100%; text-align: center; }
  .back { color: #93c5fd; text-decoration: none; font-size: 14px; font-weight: 600; }
  .glass {
    background: linear-gradient(135deg, rgba(255,255,255,0.14), rgba(255,255,255,0.05));
    border: 1px solid rgba(255,255,255,0.24); border-radius: 26px;
    backdrop-filter: blur(18px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 16px 48px rgba(0,0,0,0.3);
    padding: 36px 26px; margin-top: 24px;
  }
  .name { font-size: 24px; font-weight: 800; margin-bottom: 6px; }
  .date { font-size: 14px; color: #94a3b8; margin-bottom: 20px; }
  .days { font-size: clamp(72px, 20vw, 110px); font-weight: 800; color: #fbbf24; line-height: 1; text-shadow: 0 4px 24px rgba(0,0,0,0.35); }
  .days small { font-size: 26px; color: #cbd5e1; margin-left: 8px; }
  .hms { font-size: 20px; color: #93c5fd; font-variant-numeric: tabular-nums; margin-top: 14px; letter-spacing: 2px; }
  .note { margin-top: 24px; font-size: 13px; color: #94a3b8; }
  .add-btn { display:inline-block; margin-top:22px; padding:11px 26px; border-radius:12px; background:linear-gradient(135deg,#3B82F6,#8B5CF6); color:#fff; font-size:14px; font-weight:600; border:none; cursor:pointer; }
  .add-btn:active { transform:scale(0.97); }
  .tip { margin-top: 20px; font-size: 13px; color: #94a3b8; line-height: 2; }
  .footer { position: relative; z-index: 1; margin-top: 26px; font-size: 12px; color: #64748b; }
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4f46e5">
<link rel="canonical" href="https://daojishicn.top/share.html">
<meta property="og:type" content="website">
<meta property="og:title" content="分享的倒计时 - 查看好友分享的倒计时">
<meta property="og:description" content="查看通过链接分享的倒计时:输入标题和日期即可生成专属倒计时页面,可分享给好友。">
<meta property="og:url" content="https://daojishicn.top/share.html">
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<meta property="og:image" content="https://daojishicn.top/icon.svg">
<meta name="twitter:image" content="https://daojishicn.top/icon.svg">
</head>
<body>
<div class="stars" id="stars"></div>
<div class="container">
  <a class="back" href="index.html">← 返回首页</a>
  <div class="glass">
    <div id="content" style="display:none;">
      <div class="name" id="sName">—</div>
      <div class="date" id="sDate">—</div>
      <div class="days"><span id="sDays">--</span><small>天</small></div>
      <div class="hms" id="sHms">--:--:--</div>
      <button class="add-btn" id="addBtn">➕ 添加到我的倒计时</button>
    </div>
    <div id="empty">⚠️ 链接缺少参数,无法显示倒计时。<br>请使用自定义倒计时里的「复制分享链接」重新分享。</div>
    <div class="tip" id="tip" style="display:none;">💡 这个倒计时由好友通过链接分享,数据只来自链接本身,不会上传任何个人信息。</div>
  </div>
</div>
<div class="footer">daojishicn.top · 免费倒计时工具</div>

<script>
(function () {
  var box = document.getElementById("stars");
  for (var i = 0; i < 50; i++) {
    var s = document.createElement("span");
    var size = Math.random() * 2 + 1;
    s.style.width = s.style.height = size + "px";
    s.style.left = Math.random() * 100 + "%";
    s.style.top = Math.random() * 100 + "%";
    s.style.animationDelay = Math.random() * 3 + "s";
    box.appendChild(s);
  }

  var q = new URLSearchParams(location.search);
  var title = q.get("title");
  var date = q.get("date");
  if (!title || !date || !/^\d{4}-\d{2}-\d{2}$/.test(date)) {
    document.getElementById("empty").style.display = "block";
    return;
  }
  document.getElementById("content").style.display = "block";
  document.getElementById("tip").style.display = "block";
  document.getElementById("sName").textContent = decodeURIComponent(title);
  var p = date.split("-");
  document.getElementById("sDate").textContent = "目标日期:" + p[0] + " 年 " + parseInt(p[1]) + " 月 " + parseInt(p[2]) + " 日";

  var ts = new Date(date + "T00:00:00").getTime();
  // 一键添加到本机「我的倒计时」
  document.getElementById("addBtn").addEventListener("click", function () {
    var list = [];
    try { list = JSON.parse(localStorage.getItem("customCountdowns") || "[]"); } catch (e) {}
    if (!Array.isArray(list)) list = [];
    var exists = list.some(function (e) { return e.name === title && e.date === date; });
    if (exists) { alert("已经在你的倒计时列表里啦!"); return; }
    list.push({ name: title, date: date });
    try { localStorage.setItem("customCountdowns", JSON.stringify(list)); } catch (e) {}
    alert("已添加到「我的倒计时」!可到首页或「自定义倒计时」页面查看管理。");
  });
  setInterval(function () {
    var diff = ts - Date.now();
    if (diff <= 0) diff = 0;
    var days = Math.floor(diff / 86400000);
    var h = Math.floor((diff % 86400000) / 3600000);
    var m = Math.floor((diff % 3600000) / 60000);
    var s = Math.floor((diff % 60000) / 1000);
    document.getElementById("sDays").textContent = days;
    document.getElementById("sHms").textContent =
      (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }, 1000);
})();
</script>
<script>
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
</script>
</body>
</html>
