<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {

  .nav {

  }
  .nav .brand { font-size: 18px; font-weight: 800; color: var(--primary); text-decoration: none; letter-spacing: 0.5px; }
  .nav .links { display: flex; gap: 18px; flex: 1; flex-wrap: wrap; }
  .nav .links a { font-size: 14px; color: var(--muted); text-decoration: none; font-weight: 600; }

  .hero { max-width: 880px; margin: 0 auto; padding: 52px 20px 20px; text-align: center; }
  .hero .tag { font-size: 13px; color: var(--muted); letter-spacing: 2px; margin-bottom: 10px; }
  .hero h1 { font-size: 32px; font-weight: 800; color: var(--text); margin-bottom: 8px; }

  .hero .sub { font-size: 15px; color: var(--muted); margin-bottom: 28px; }

  .target-select { margin-bottom: 24px; }
  .target-select select {
    font-size: 15px; padding: 10px 16px; border: 1px solid var(--border); border-radius: 12px;
    background: #fff; color: var(--text); min-height: 44px; min-width: 220px;

  .big-card {

  .big-card .t-name { font-size: 20px; font-weight: 800; }
  .big-card .t-full { font-size: 13px; color: var(--muted); margin: 4px 0 18px; }
  .big-card .t-days { font-size: clamp(72px, 16vw, 110px); font-weight: 800; line-height: 1; color: var(--primary); letter-spacing: -2px; font-variant-numeric: tabular-nums; }
  .big-card .t-days small { font-size: 26px; color: var(--muted); letter-spacing: 0; }
  .big-card .t-hms { font-size: 22px; color: var(--text); font-variant-numeric: tabular-nums; margin: 10px 0 6px; }
  .big-card .t-date { font-size: 14px; color: var(--muted); }
  .big-card .t-status {
    display: inline-block; margin-top: 16px; font-size: 14px; font-weight: 700;

  }
  .big-card .t-status.warn { background: var(--accent); }
  .hero-actions { margin-top: 22px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .hero-actions a {
    display: inline-block; padding: 13px 28px; border-radius: 999px; font-size: 15px; font-weight: 700;
    text-decoration: none; min-height: 46px; line-height: 20px;
  }
  .hero-actions .primary { background: var(--primary); color: #fff; }
  .hero-actions .ghost { background: #fff; color: var(--primary); border: 1px solid var(--border); }

  .section { max-width: 880px; margin: 0 auto; padding: 40px 20px 10px; }
  .section-title { font-size: 16px; font-weight: 800; color: var(--text); margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
  .section-title::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .card {
    background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 18px;
    text-decoration: none; color: inherit; display: block; transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(27,33,30,0.08); }
  .card .name { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .card .date { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .card .days { font-size: 26px; font-weight: 800; color: var(--primary); font-variant-numeric: tabular-nums; }
  .card .days small { font-size: 12px; color: var(--muted); font-weight: 600; }
  .card .days.hot { color: var(--accent); }

  .mine { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 8px 20px; }
  .mine-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid var(--border); }
  .mine-item:last-child { border-bottom: none; }
  .mine-item .n { font-size: 15px; font-weight: 700; }
  .mine-item .d { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .mine-item .days { font-size: 22px; font-weight: 800; color: var(--primary); font-variant-numeric: tabular-nums; }
  .mine-empty { text-align: center; padding: 26px 0; color: var(--muted); font-size: 14px; line-height: 2; }
  .mine-empty a { color: var(--primary); font-weight: 700; text-decoration: none; }

  .tool-row { display: flex; gap: 12px; flex-wrap: wrap; }
  .tool-chip {
    display: inline-flex; align-items: center; gap: 8px;
    background: #fff; border: 1px solid var(--border); border-radius: 999px;
    padding: 10px 20px; text-decoration: none; color: var(--text); font-size: 14px; font-weight: 600;
  }
  .tool-chip:hover { border-color: var(--primary); color: var(--primary); }

  .tip { max-width: 880px; margin: 0 auto; padding: 8px 20px; font-size: 13px; color: var(--muted); line-height: 2; }
  .footer { text-align: center; font-size: 12px; color: var(--muted); padding: 30px 16px 44px; }
  .footer a { color: var(--primary); text-decoration: none; }

  .bottom-add {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
    display: none; background: rgba(244,245,241,0.95); border-top: 1px solid var(--border); padding: 10px 16px;
  }
  .bottom-add a {
    display: block; text-align: center; background: var(--primary); color: #fff;
    border-radius: 999px; padding: 13px; font-size: 15px; font-weight: 700; text-decoration: none;
  }

  @media (max-width: 640px) {
    .nav { padding: 12px 14px; gap: 12px; }
    .nav .links { order: 3; width: 100%; justify-content: space-between; }
    .hero { padding: 36px 16px 16px; }
    .hero h1 { font-size: 26px; }
    .big-card { padding: 28px 18px; }
    .bottom-add { display: block; }
    .footer { padding-bottom: 90px; }
  }

<script>
// 热门考试数据
var events = [
  { name: "2027 国考", date: "2026-11-29", url: "guokao-daojishi.html", full: "国家公务员考试笔试" },
  { name: "四六级", date: "2026-12-19", url: "siliuji-daojishi.html", full: "大学英语四六级考试" },
  { name: "2027 考研", date: "2026-12-19", url: "kaoyan-daojishi.html", full: "全国硕士研究生招生考试" },
  { name: "2027 元旦", date: "2027-01-01", url: "yuandan-daojishi.html", full: "新年第一天" },
  { name: "2027 春节", date: "2027-02-06", url: "chunjie-daojishi.html", full: "农历正月初一" },
  { name: "2027 教资", date: "2027-03-13", url: "jiazi-daojishi.html", full: "教师资格证笔试" },
  { name: "2027 省考", date: "2027-03-20", url: "shengkao-daojishi.html", full: "公务员省考联考" },
  { name: "计算机二级", date: "2027-03-27", url: "erji-daojishi.html", full: "全国计算机等级考试" },
  { name: "2027 高考", date: "2027-06-07", url: "gaokao-daojishi.html", full: "全国统一高考" },
  { name: "2027 端午", date: "2027-06-09", url: "duanwu-daojishi.html", full: "农历五月初五" },
  { name: "2027 中考", date: "2027-06-18", url: "zhongkao-daojishi.html", full: "初中毕业生学业考试" },
  { name: "2027 中秋", date: "2027-09-15", url: "zhongqiu-daojishi.html", full: "农历八月十五" },
  { name: "2027 国庆", date: "2027-10-01", url: "guoqing-daojishi.html", full: "国庆节" }
];

function daysLeft(dateStr) {
  var diff = new Date(dateStr + "T00:00:00") - new Date();
  return diff > 0 ? Math.floor(diff / 86400000) : 0;
}

// 热门网格
var grid = document.getElementById("examGrid");
events.forEach(function (e) {
  var d = daysLeft(e.date);
  var card = document.createElement("a");
  card.className = "card";
  card.href = e.url;
  card.innerHTML =
    '<div class="name">' + e.name + "</div>" +
    '<div class="date">' + e.date.split("-")[0] + " 年 " + parseInt(e.date.split("-")[1]) + " 月 " + parseInt(e.date.split("-")[2]) + " 日</div>" +
    '<div class="days' + (d <= 30 ? " hot" : "") + '">' + d + "<small>天</small></div>";
  grid.appendChild(card);
});

// 主目标第一屏
var cur = null;
var sel = document.getElementById("targetSel");
events.forEach(function (e) {
  var o = document.createElement("option");
  o.value = e.name;
  o.textContent = e.name + "(还剩" + daysLeft(e.date) + "天)";
  sel.appendChild(o);
});

function setTarget(name) {
  cur = events.find(function (e) { return e.name === name; }) || null;
  try { localStorage.setItem("homeTarget", name); } catch (e) {}
  renderHero();
}

function loadTarget() {
  var saved = null;
  try { saved = localStorage.getItem("homeTarget"); } catch (e) {}
  var t = events.find(function (e) { return e.name === saved; });
  if (t) { cur = t; sel.value = t.name; } else { cur = events[2]; sel.value = events[2].name; }
}

function renderHero() {
  if (!cur) return;
  document.getElementById("tName").textContent = cur.name;
  document.getElementById("tFull").textContent = cur.full;
  var p = cur.date.split("-");
  document.getElementById("tDate").textContent = "目标日期:" + p[0] + " 年 " + parseInt(p[1]) + " 月 " + parseInt(p[2]) + " 日";
  document.getElementById("focusBtn").href = cur.url;
  tick();
}

function tick() {
  if (!cur) return;
  var diff = new Date(cur.date + "T00:00:00") - new Date();
  if (diff < 0) diff = 0;
  var days = Math.floor(diff / 86400000);
  var h = Math.floor((diff % 86400000) / 3600000);
  var m = Math.floor((diff % 3600000) / 60000);
  var s = Math.floor((diff % 60000) / 1000);
  document.getElementById("tDays").textContent = days;
  document.getElementById("tHms").textContent =
    (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  var st = document.getElementById("tStatus");
  if (days > 90) { st.textContent = "保持节奏,稳步推进"; st.className = "t-status"; }
  else if (days > 30) { st.textContent = "进入冲刺阶段,加油!"; st.className = "t-status"; }
  else if (days > 7) { st.textContent = "重点检查与模拟冲刺"; st.className = "t-status warn"; }
  else if (days > 1) { st.textContent = "最终准备,稳住心态"; st.className = "t-status warn"; }
  else { st.textContent = "目标时刻就要到了!"; st.className = "t-status warn"; }
}

// 我的目标(读取自定义倒计时的 localStorage)
function renderMine() {
  var box = document.getElementById("mineBox");
  var list = [];
  try { list = JSON.parse(localStorage.getItem("customCountdowns") || "[]"); } catch (e) {}
  if (list.length === 0) {
    box.innerHTML = '<div class="mine-empty">还没有目标<br><a href="zidingyi-daojishi.html">创建一个目标</a>,或从上面的热门考试开始</div>';
    return;
  }
  box.innerHTML = "";
  list.slice(0, 3).forEach(function (e) {
    var d = daysLeft(e.date);
    var div = document.createElement("div");
    div.className = "mine-item";
    div.innerHTML =
      '<div><div class="n">' + (e.name || "未命名") + "</div>" +
      '<div class="d">' + e.date + "</div></div>" +
      '<div class="days">' + d + "天</div>";
    box.appendChild(div);
  });
  if (list.length > 3) {
    var more = document.createElement("div");
    more.className = "mine-empty";
    more.innerHTML = "还有 " + (list.length - 3) + " 个目标,<a href='zidingyi-daojishi.html'>去管理全部</a>";
    box.appendChild(more);
  }
}

loadTarget();
renderHero();
setInterval(tick, 1000);
renderMine();
</script>
</body>
