function daysLeft(dateStr) {
  if (!dateStr) return 0;
  var diff = new Date(dateStr + "T00:00:00") - new Date();
  return diff > 0 ? Math.floor(diff / 86400000) : 0;
}

var container = document.getElementById("container");
groups.forEach(function (g) {
  var title = document.createElement("div");
  title.className = "group-title";
  title.textContent = g.title;
  container.appendChild(title);

  var grid = document.createElement("div");
  grid.className = "grid";

  g.items.forEach(function (e) {
    var card = document.createElement("a");
    card.className = "card " + e.css;
    card.href = e.url;

    var dateText = e.date
      ? e.date.split("-")[0] + " 年 " + parseInt(e.date.split("-")[1]) + " 月 " + parseInt(e.date.split("-")[2]) + " 日"
      : e.note;

    var daysHtml;
    if (e.type === "count") {
      var d = daysLeft(e.date);
      daysHtml = '<div class="days">' + d + "<small>天</small></div>";
    } else if (e.type === "input") {
      daysHtml = '<div class="days">--<small>天</small></div>';
    } else if (e.type === "tool") {
      daysHtml = '<div class="pill">🧰 在线使用</div>';
    } else {
      daysHtml = '<div class="pill">📖 阅读</div>';
    }

      '<div class="name">' + e.name + "</div>" +
      '<div class="date">' + dateText + "</div>" +
      daysHtml;
    grid.appendChild(card);
  });

  container.appendChild(grid);
});
