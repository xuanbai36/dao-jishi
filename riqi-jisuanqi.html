<body>
<div class="header">
  <h1>日期<em>计算器</em></h1>
  <p>相差天数 · N 天后是哪天 · 年龄计算</p>
  <a class="back" href="index.html">← 返回首页</a>
</div>

<div class="container">

  <div class="glass">
    <h2>📆 两个日期相差多少天</h2>
    <div class="desc">选择两个日期,计算中间隔了多少天</div>
    <div class="row">
      <div class="f"><label>开始日期</label><input type="date" id="d1"></div>
      <div class="f"><label>结束日期</label><input type="date" id="d2"></div>
      <button class="btn" onclick="calcDiff()">计算</button>
    </div>
    <div class="result" id="rDiff"></div>
  </div>

  <div class="glass">
    <h2>📅 N 天后(前)是哪一天</h2>
    <div class="desc">在指定日期上加或减 N 天,得到结果日期</div>
    <div class="row">
      <div class="f"><label>基准日期</label><input type="date" id="d3"></div>
      <div class="f"><label>加/减天数(负数表示往前)</label><input type="number" id="n" placeholder="如:100 或 -30"></div>
      <button class="btn" onclick="calcAdd()">计算</button>
    </div>
    <div class="result" id="rAdd"></div>
  </div>

  <div class="glass">
    <h2>🎂 年龄计算</h2>
    <div class="desc">输入出生日期,计算当前年龄(年/月/天)</div>
    <div class="row">
      <div class="f"><label>出生日期</label><input type="date" id="birth"></div>
      <button class="btn" onclick="calcAge()">计算</button>
    </div>
    <div class="result" id="rAge"></div>
  </div>

  <div class="glass" style="font-size:13px;color:#64748b;line-height:2;">
    💡 提示:日期计算按自然日计算(不含当天算 0 天)。年龄按当前日期计算。
  </div>
</div>

<div class="footer">日期计算器 · 免费使用</div>

<script>
function fmt(d) {
  return d.getFullYear() + " 年 " + (d.getMonth() + 1) + " 月 " + d.getDate() + " 日";
}

function calcDiff() {
  var a = document.getElementById("d1").value;
  var b = document.getElementById("d2").value;
  var box = document.getElementById("rDiff");
  if (!a || !b) { box.textContent = "请选择两个日期"; box.style.display = "block"; return; }
  var diff = Math.round((new Date(b) - new Date(a)) / 86400000);
  var txt = diff === 0 ? "两个日期是同一天"
    : diff > 0 ? "相差 <b>" + diff + "</b> 天"
    : "相差 <b>" + (-diff) + "</b> 天(结束日期在前)";
  box.innerHTML = txt + '<div class="sub">' + fmt(new Date(a)) + " → " + fmt(new Date(b)) + "</div>";
  box.style.display = "block";
}

function calcAdd() {
  var a = document.getElementById("d3").value;
  var n = parseInt(document.getElementById("n").value);
  var box = document.getElementById("rAdd");
  if (!a || isNaN(n)) { box.textContent = "请填写日期和天数"; box.style.display = "block"; return; }
  var d = new Date(a);
  d.setDate(d.getDate() + n);
  box.innerHTML = (n >= 0 ? "加 " : "减 ") + Math.abs(n) + " 天后是 <b>" + fmt(d) + "</b><div class='sub'>" + (d.getDay() === 0 ? "星期日" : "星期" + "一二三四五六"[d.getDay() - 1]) + "</div>";
  box.style.display = "block";
}

function calcAge() {
  var b = document.getElementById("birth").value;
  var box = document.getElementById("rAge");
  if (!b) { box.textContent = "请选择出生日期"; box.style.display = "block"; return; }
  var birth = new Date(b), now = new Date();
  var years = now.getFullYear() - birth.getFullYear();
  var months = now.getMonth() - birth.getMonth();
  var days = now.getDate() - birth.getDate();
  if (days < 0) { months--; days += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
  if (months < 0) { years--; months += 12; }
  box.innerHTML = "年龄 <b>" + years + "</b> 岁 <b>" + months + "</b> 个月 <b>" + days + "</b> 天<div class='sub'>出生日期:" + fmt(birth) + "</div>";
  box.style.display = "block";
}
</script>
