<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<meta property="og:image" content="https://daojishicn.top/icon.svg">
<meta name="twitter:image" content="https://daojishicn.top/icon.svg">
<title>404 - 页面不存在 | 上岸日历</title>
<meta name="robots" content="noindex">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    min-height: 100vh; color: #e2e8f0;
    background: linear-gradient(160deg, #0b1020 0%, #131a35 55%, #1e1b4b 100%);
    display: flex; align-items: center; justify-content: center; text-align: center; padding: 40px 20px;
  }
  .card {
    background: linear-gradient(135deg, rgba(255,255,255,0.09), rgba(255,255,255,0.03));
    border: 1px solid rgba(255,255,255,0.14); border-radius: 28px; padding: 48px 36px;
    backdrop-filter: blur(20px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), 0 24px 60px rgba(0,0,0,0.4);
    max-width: 480px;
  }
  .code { font-size: clamp(80px, 18vw, 120px); font-weight: 800; color: #38bdf8; font-family: ui-monospace, Menlo, Consolas, monospace; }
  p { font-size: 16px; color: #94a3b8; margin: 10px 0 26px; }
  a {
    display: inline-block; padding: 13px 30px; border-radius: 999px;
    background: linear-gradient(135deg, #38bdf8, #6366f1); color: #fff;
    text-decoration: none; font-size: 15px; font-weight: 700; box-shadow: 0 8px 26px rgba(56,189,248,0.3);
  }
</style>
</head>
<body>
<div class="card">
  <div class="code">404</div>
  <p>页面不存在或已被移动<br>请检查网址,或返回首页</p>
  <a href="/">← 返回上岸日历</a>
</div>
</body>
</html>
