<div class="container">
  <div class="glass">
    <h2>🎨 生成海报</h2>
    <div class="field"><label>事件名称</label><input type="text" id="pTitle" placeholder="比如:距离 2027 考研" value="距离 2027 考研"></div>
    <div class="field"><label>目标日期</label><input type="date" id="pDate"></div>
    <button class="btn" onclick="gen()">生成海报</button>
    <button class="btn ghost" onclick="download()">💾 下载图片</button>
    <div class="tip">💡 生成后长按图片可保存到手机,或点「下载图片」保存到电脑。请勿在名称/日期中填写个人敏感信息。</div>
  </div>

    <h2>📸 海报预览</h2>
    <canvas id="cv" width="600" height="800"></canvas>
  </div>
</div>

<script>
// 从 URL 参数读取(支持从自定义倒计时跳转)
(function () {
  var q = new URLSearchParams(location.search);
  if (q.get("title")) document.getElementById("pTitle").value = decodeURIComponent(q.get("title"));
  if (q.get("date")) document.getElementById("pDate").value = q.get("date");
  if (q.get("title") || q.get("date")) setTimeout(gen, 100);
})();

function daysLeft(dateStr) {
  var diff = new Date(dateStr + "T00:00:00") - new Date();
  return diff > 0 ? Math.floor(diff / 86400000) : 0;
}

function gen() {
  var title = document.getElementById("pTitle").value.trim() || "倒计时";
  var date = document.getElementById("pDate").value;
  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d");
  var W = 600, H = 800;
  cv.width = W; cv.height = H;

  // 背景渐变
  var g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, "#1e1b4b");
  g.addColorStop(0.55, "#312e81");
  g.addColorStop(1, "#0e7490");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // 光斑
  ctx.globalAlpha = 0.25;
  var rg = ctx.createRadialGradient(480, 120, 20, 480, 120, 220);
  rg.addColorStop(0, "#818cf8"); rg.addColorStop(1, "transparent");
  ctx.fillStyle = rg; ctx.fillRect(300, 0, 300, 340);
  var rg2 = ctx.createRadialGradient(120, 680, 20, 120, 680, 200);
  rg2.addColorStop(0, "#22d3ee"); rg2.addColorStop(1, "transparent");
  ctx.fillStyle = rg2; ctx.fillRect(0, 480, 300, 320);
  ctx.globalAlpha = 1;

  // 顶部标签
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  ctx.font = "600 22px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("⏳ 倒计时", W / 2, 90);

  // 标题
  ctx.fillStyle = "#ffffff";
  ctx.font = "800 34px sans-serif";
  wrapText(ctx, title, W / 2, 170, W - 80, 48, 34);

  // 分隔线
  ctx.strokeStyle = "rgba(255,255,255,0.3)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(W / 2 - 70, 300);
  ctx.lineTo(W / 2 + 70, 300);
  ctx.stroke();

  // 天数
  var days = date ? daysLeft(date) : 0;
  ctx.fillStyle = "#fbbf24";
  ctx.font = "800 150px sans-serif";
  ctx.fillText(String(days), W / 2, 470);
  ctx.fillStyle = "rgba(255,255,255,0.9)";
  ctx.font = "600 34px sans-serif";
  ctx.fillText("天", W / 2 + (String(days).length * 60), 470);

  ctx.fillStyle = "rgba(255,255,255,0.85)";
  ctx.font = "500 26px sans-serif";
  ctx.fillText("距离目标还有", W / 2, 530);

  // 日期
  if (date) {
    var p = date.split("-");
    ctx.fillStyle = "rgba(255,255,255,0.7)";
    ctx.font = "500 24px sans-serif";
    ctx.fillText("目标日期:" + p[0] + " 年 " + parseInt(p[1]) + " 月 " + parseInt(p[2]) + " 日", W / 2, 610);
  }

  // 网址
  ctx.fillStyle = "rgba(255,255,255,0.55)";
  ctx.font = "500 20px sans-serif";
  ctx.fillText("daojishicn.top · 免费倒计时工具", W / 2, 760);
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight, fontSize) {
  var words = String(text).split("");
  var lines = [];
  var line = "";
  for (var i = 0; i < words.length; i++) {
    var test = line + words[i];
    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line);
      line = words[i];
    } else line = test;
  }
  lines.push(line);
  lines.slice(0, 2).forEach(function (l, idx) {
    ctx.fillText(l, x, y + idx * lineHeight);
  });
}

function download() {
  var a = document.createElement("a");
  a.download = "daojishi-post-" + Date.now() + ".png";
  a.href = document.getElementById("cv").toDataURL("image/png");
  a.click();
}
</script>
