<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;

  }

    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 60% 45%, transparent 0 18%, rgba(180, 140, 40, 0.25) 20% 24%, transparent 26%),
                radial-gradient(circle at 30% 65%, transparent 0 12%, rgba(180, 140, 40, 0.2) 14% 18%, transparent 20%);
  }

  .header { position: relative; z-index: 1; text-align: center; padding: 64px 20px 40px; }

  .header p { font-size: 14px; color: #94a3b8; letter-spacing: 1px; }

  .glass h2 { font-size: 17px; font-weight: 700; color: #f1f5f9; margin-bottom: 6px; }

    font-size: 16px; padding: 10px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.1); color: #fff; font-family: inherit;

  .btn {
    background: linear-gradient(135deg, #818cf8, #6366f1);

<body>
<div class="stars" id="stars"></div>
<div class="moon"></div>

<div class="header">
  <h1>睡眠计算器</h1>
  <p>按 90 分钟睡眠周期,科学安排入睡与起床</p>
</div>

<div class="container">

  <div class="glass">
    <h2>🌅 按「起床时间」倒推入睡</h2>
    <div class="desc">选择你明天必须起床的时间,计算器给出推荐入睡时间</div>
    <div class="row">
      <label>起床时间</label>
      <input type="time" id="wakeTime" value="07:00">
      <button class="btn" onclick="calcFromWake()">计算</button>
    </div>
    <div class="result" id="wakeResult"></div>
  </div>

  <div class="glass">
    <h2>🌙 按「入睡时间」顺推起床</h2>
    <div class="desc">选择你打算几点睡,计算器给出睡满周期的最佳起床时间</div>
    <div class="row">
      <label>入睡时间</label>
      <input type="time" id="sleepTime" value="23:30">
      <button class="btn" onclick="calcFromSleep()">计算</button>
    </div>
    <div class="result" id="sleepResult"></div>
  </div>

  <div class="glass tip">
    <h2>💡 睡眠周期小知识</h2>
    <p>一个完整睡眠周期约 <b>90 分钟</b>,包括浅睡、深睡、快速眼动(做梦)等阶段。在<b>周期结束时刻</b>醒来,精神状态最好;在深睡阶段被叫醒,会昏昏沉沉。</p>
    <p>建议:按整数周期睡(4~5 个周期 ≈ 6~7.5 小时),并提前 <b>15 分钟上床</b>酝酿睡意。熬夜后补觉也要按整周期睡,效果更好。</p>
  </div>
</div>

<div class="footer">睡眠计算器 · 仅供参考 · 规律作息最重要</div>

<script>
// 生成星空
(function () {
  var box = document.getElementById("stars");
  for (var i = 0; i < 70; i++) {
    var s = document.createElement("span");
    var size = Math.random() * 2.2 + 1;
    s.style.width = s.style.height = size + "px";
    s.style.left = Math.random() * 100 + "%";
    s.style.top = Math.random() * 100 + "%";
    s.style.opacity = Math.random() * 0.8 + 0.2;
    s.style.animationDelay = Math.random() * 3 + "s";
    box.appendChild(s);
  }
})();

function fmt(mins) {
  mins = ((mins % 1440) + 1440) % 1440;
  var h = Math.floor(mins / 60);
  var m = mins % 60;
  return (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m;
}

function toMins(timeStr) {
  var p = timeStr.split(":");
  return parseInt(p[0]) * 60 + parseInt(p[1]);
}

function calcFromWake() {
  var wake = toMins(document.getElementById("wakeTime").value);
  var html = "";
  [
    { n: 5, label: "睡 5 个周期(7.5 小时)· 推荐", hot: true },
    { n: 4, label: "睡 4 个周期(6 小时)", hot: false },
    { n: 3, label: "睡 3 个周期(4.5 小时)", hot: false }
  ].forEach(function (o) {
    var sleep = wake - o.n * 90;
    html += '<div class="item' + (o.hot ? ' hot' : '') + '">' +
      '<span class="t">' + o.label + '</span>' +
      '<span class="v">' + fmt(sleep) + ' 入睡</span></div>';
  });
  html += '<div class="item"><span class="t">建议提前 15 分钟上床酝酿睡意</span><span class="v" style="color:#94a3b8;font-size:14px;">约为 ' + fmt(wake - 7.5 * 60 - 15) + ' 上床</span></div>';
  var box = document.getElementById("wakeResult");
  box.innerHTML = html;
  box.style.display = "block";
}

function calcFromSleep() {
  var sleep = toMins(document.getElementById("sleepTime").value);
  var html = "";
  [
    { n: 5, label: "睡 5 个周期(7.5 小时)· 推荐", hot: true },
    { n: 4, label: "睡 4 个周期(6 小时)", hot: false },
    { n: 3, label: "睡 3 个周期(4.5 小时)", hot: false }
  ].forEach(function (o) {
    var wake = sleep + o.n * 90;
    html += '<div class="item' + (o.hot ? ' hot' : '') + '">' +
      '<span class="t">' + o.label + '</span>' +
      '<span class="v">' + fmt(wake) + ' 起床</span></div>';
  });
  var box = document.getElementById("sleepResult");
  box.innerHTML = html;
  box.style.display = "block";
}
</script>
