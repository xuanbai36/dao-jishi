<body>
<div class="glow glow-1"></div>
<div class="glow glow-2"></div>
<div class="container">
  <a class="back" href="index.html">← 返回首页</a>
  <h1>世界<span>时钟</span></h1>
  <div class="subtitle">全球多城市时间,实时显示</div>

  <div class="local">
    <div class="l-name">📍 你的位置</div>
    <div class="l-time" id="localTime">--:--:--</div>
    <div class="l-date" id="localDate">—</div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="note">💡 时间随浏览器自动更新 · 城市时间基于 IANA 时区(自动处理夏令时)</div>
</div>
<div class="footer">世界时钟 · 免费使用</div>

<script>
var cities = [
  { name: "北京", tz: "Asia/Shanghai" },
  { name: "东京", tz: "Asia/Tokyo" },
  { name: "新加坡", tz: "Asia/Singapore" },
  { name: "悉尼", tz: "Australia/Sydney" },
  { name: "迪拜", tz: "Asia/Dubai" },
  { name: "莫斯科", tz: "Europe/Moscow" },
  { name: "伦敦", tz: "Europe/London" },
  { name: "巴黎", tz: "Europe/Paris" },
  { name: "纽约", tz: "America/New_York" },
  { name: "洛杉矶", tz: "America/Los_Angeles" }
];

var fmt = new Intl.DateTimeFormat("zh-CN", { hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" });
var fmtDate = new Intl.DateTimeFormat("zh-CN", { year: "numeric", month: "long", day: "numeric", weekday: "long" });

function cityFmt(tz) {
  return new Intl.DateTimeFormat("zh-CN", { timeZone: tz, hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" });
}
var cityFormats = {};
cities.forEach(function (c) { cityFormats[c.tz] = cityFmt(c.tz); });

// 渲染城市卡片
var grid = document.getElementById("grid");
cities.forEach(function (c, i) {
  var div = document.createElement("div");
  div.className = "city";
  div.id = "city" + i;
  div.innerHTML =
    '<div class="c-name">' + c.name + "</div>" +
    '<div class="c-time" id="t' + i + '">--:--:--</div>' +
    '<div class="c-date" id="d' + i + '"></div>';
  grid.appendChild(div);
});

function tick() {
  var now = new Date();
  document.getElementById("localTime").textContent = fmt.format(now);
  document.getElementById("localDate").textContent = fmtDate.format(now);
  cities.forEach(function (c, i) {
    var parts = cityFormats[c.tz].formatToParts(now);
    var hm = parts.filter(function (p) { return p.type === "hour" || p.type === "minute" || p.type === "second"; }).map(function (p) { return p.value; }).join(":");
    document.getElementById("t" + i).textContent = hm;
    var h = parts.find(function (p) { return p.type === "hour"; });
    var hour = parseInt(h ? h.value : 0);
    document.getElementById("city" + i).className = "city" + (hour < 6 || hour >= 19 ? " night" : "");
    var dp = new Intl.DateTimeFormat("zh-CN", { timeZone: c.tz, month: "numeric", day: "numeric", weekday: "short" }).format(now);
    document.getElementById("d" + i).textContent = dp;
  });
}
tick();
setInterval(tick, 1000);
</script>
