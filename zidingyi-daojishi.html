<meta name="keywords" content="自定义倒计时,倒计时制作,纪念日倒计时,生日倒计时,倒计时工具">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: #f3f4f6;
    min-height: 100vh;
    color: #1f2937;
  }
  .header {
    background: linear-gradient(160deg, #0f766e 0%, #14b8a6 100%);
    color: #fff;
    text-align: center;
    padding: 40px 16px 48px;
  }
  .header h1 { font-size: 28px; font-weight: 800; margin-bottom: 8px; }
  .header p { font-size: 15px; opacity: 0.85; }
  .container { max-width: 720px; margin: -24px auto 60px; padding: 0 16px; }
  .card {
    background: #fff; border-radius: 16px; padding: 24px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08); margin-bottom: 16px;
  }
  .card h2 { font-size: 17px; color: #0f766e; margin-bottom: 16px; }
  .form-row { display: flex; gap: 12px; flex-wrap: wrap; }
  .form-row label { font-size: 13px; color: #6b7280; display: block; margin-bottom: 6px; }
  .form-row .field { flex: 1; min-width: 140px; }
  .form-row input {
    width: 100%; font-size: 15px; padding: 10px 12px;
    border: 1px solid #d1d5db; border-radius: 10px; color: #1f2937;
  }
  .btn {
    background: #0f766e; color: #fff; border: none; border-radius: 10px;
    font-size: 16px; font-weight: 600; padding: 12px 28px; cursor: pointer;
    margin-top: 16px;
  }
  .btn:active { transform: scale(0.97); }
  .btn.ghost { background: #e5e7eb; color: #374151; padding: 8px 16px; font-size: 13px; margin-top: 0; }
  .btn.del { background: #fee2e2; color: #b91c1c; padding: 6px 12px; font-size: 13px; margin-top: 0; }
  .countdown-box { text-align: center; padding: 28px 16px; }
  .countdown-box .name { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .countdown-box .date { font-size: 13px; color: #6b7280; margin-bottom: 14px; }
  .days-number { font-size: 84px; font-weight: 800; color: #0f766e; line-height: 1.1; }
  .days-number small { font-size: 22px; font-weight: 600; color: #6b7280; margin-left: 6px; }
  .time-row { display: flex; justify-content: center; gap: 14px; margin-top: 18px; }
  .time-item { background: #f3f4f6; border-radius: 10px; padding: 8px 14px; min-width: 76px; }
  .time-item .num { font-size: 22px; font-weight: 700; }
  .time-item .txt { font-size: 12px; color: #6b7280; margin-top: 2px; }
  .empty { text-align: center; color: #9ca3af; font-size: 14px; padding: 20px 0; }
  .item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 4px; border-bottom: 1px solid #f3f4f6; cursor: pointer;
  }
  .item:last-child { border-bottom: none; }
  .item .info .n { font-size: 15px; font-weight: 600; }
  .item .info .d { font-size: 12px; color: #6b7280; margin-top: 2px; }
  .item .days { font-size: 20px; font-weight: 700; color: #0f766e; }
  .item .days small { font-size: 12px; color: #6b7280; font-weight: 400; }
  .item-actions { display: flex; gap: 8px; align-items: center; }
  .tip { font-size: 13px; color: #6b7280; line-height: 1.8; }
  .footer { text-align: center; font-size: 12px; color: #9ca3af; padding: 0 16px 40px; }
</style>
<link rel="canonical" href="https://daojishicn.top/zidingyi-daojishi.html">
<meta property="og:type" content="website">
<meta property="og:title" content="自定义倒计时 - 创建属于你的倒计时">
<meta property="og:description" content="自定义倒计时工具:输入任意事件名称和日期,创建属于你的倒计时(生日、纪念日、考试、旅行……),自动保存列表,下次打开还在。">
<meta property="og:url" content="https://daojishicn.top/zidingyi-daojishi.html">
<meta name="twitter:card" content="summary">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4f46e5">
</head>
<body>
<div class="header">
  <h1>自定义倒计时</h1>
  <p>生日、纪念日、考试、旅行……创建属于你的倒计时</p>
</div>

<div class="container">
  <div class="card">
    <h2>创建新的倒计时</h2>
    <div class="form-row">
      <div class="field" style="flex:1.4;">
        <label>事件名称</label>
        <input type="text" id="evName" placeholder="比如:我的生日 / 期末考试">
      </div>
      <div class="field">
        <label>日期</label>
        <input type="date" id="evDate">
      </div>
      <div class="field">
        <label>时间(可选)</label>
        <input type="time" id="evTime" value="00:00">
      </div>
    </div>
    <div class="field" style="margin-top:12px;">
      <label>备注(可选)</label>
      <input type="text" id="evNote" placeholder="比如:给 TA 的惊喜 / 期末冲刺">
    </div>
    <div class="field" style="margin-top:12px;">
      <label>开始日期(可选,用于显示备考进度)</label>
      <input type="date" id="evStart">
    </div>
    <div style="margin-top:12px;">
      <label style="font-size:13px;color:#6b7280;"><input type="checkbox" id="evHideHms"> 仅显示天数(隐藏时分秒)</label>
    </div>
    <div style="margin-top:12px;">
      <span style="font-size:13px;color:#6b7280;">快捷模板:</span>
      <button class="btn ghost" onclick="useTpl('🎂 距离生日')">生日</button>
      <button class="btn ghost" onclick="useTpl('🎓 距离毕业')">毕业</button>
      <button class="btn ghost" onclick="useTpl('✈️ 距离旅行')">旅行</button>
      <button class="btn ghost" onclick="useTpl('💰 距离发工资')">发工资</button>
      <button class="btn ghost" onclick="useTpl('📋 距离项目截止')">项目截止</button>
      <button class="btn ghost" onclick="useTpl('💼 距离面试')">面试</button>
      <button class="btn ghost" onclick="useTpl('📝 距离考试')">考试</button>
    </div>
    <button class="btn" onclick="addEvent()">添加倒计时</button>
  </div>

  <div class="card countdown-box" id="countdownBox" style="display:none;">
    <div class="name" id="cdName">—</div>
    <div class="date" id="cdDate">—</div>
    <div class="days-number"><span id="cdDays">--</span><small>天</small></div>
    <div class="time-row" id="cdTimeRow">
      <div class="time-item"><div class="num" id="cdHours">--</div><div class="txt">小时</div></div>
      <div class="time-item"><div class="num" id="cdMinutes">--</div><div class="txt">分钟</div></div>
      <div class="time-item"><div class="num" id="cdSeconds">--</div><div class="txt">秒</div></div>
    </div>
    <div id="progWrap" style="display:none;margin-top:16px;">
      <div style="font-size:12px;color:#6b7280;margin-bottom:6px;">备考进度 <span id="progPct"></span></div>
      <div style="height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden;"><div id="progBar" style="height:100%;width:0%;background:#0f766e;border-radius:999px;"></div></div>
    </div>
    <div style="margin-top:16px;">
      <button class="btn ghost" onclick="shareCurrent()">🔗 复制分享链接</button>
      <button class="btn ghost" onclick="makePoster()">🖼️ 生成海报</button>
      <button class="btn ghost" onclick="addToCalendar()">📅 加入日历</button>
    </div>
  </div>

  <div class="card">
    <h2>我的倒计时列表<span style="font-size:12px;color:#9ca3af;font-weight:400;">(自动保存在本浏览器)</span></h2>
    <div style="margin-bottom:12px;">
      <button class="btn ghost" onclick="exportData()">📤 导出列表</button>
      <button class="btn ghost" onclick="document.getElementById('importFile').click()">📥 导入列表</button>
      <input type="file" id="importFile" accept=".json,application/json" style="display:none;" onchange="importData(this)">
    </div>
    <div id="list"></div>
    <div class="empty" id="empty">
      还没有目标<br><br>
      <button class="btn ghost" onclick="quickAdd('2027 考研','2026-12-19')">＋ 考研</button>
      <button class="btn ghost" onclick="quickAdd('2027 高考','2027-06-07')">＋ 高考</button>
      <button class="btn ghost" onclick="quickAdd('2027 春节','2027-02-06')">＋ 春节</button>
      <br><br>或在上方创建属于你的目标
    </div>
  </div>

  <div class="card tip">
    💡 数据默认只保存在<b>本设备</b>,不会上传服务器。你可以<b>导出备份</b>,也可以通过<b>分享链接</b>在其他设备打开。换浏览器或清理缓存会清空列表。
  </div>
</div>

<div class="footer">自定义倒计时 · 免费使用</div>

<script>
var events = [];
var timer = null;
var curIndex = -1;

function shareCurrent() {
  if (curIndex < 0 || !events[curIndex]) { alert("请先选择一个倒计时"); return; }
  var e = events[curIndex];
  var base = location.origin + location.pathname.replace(/[^/]*$/, "");
  var url = base + "share.html?title=" + encodeURIComponent(e.name) + "&date=" + e.date;
  copyText(url);
  alert("分享链接已复制:\n" + url + "\n发给好友,对方打开就能看到这个倒计时。");
}

function makePoster() {
  if (curIndex < 0 || !events[curIndex]) { alert("请先选择一个倒计时"); return; }
  var e = events[curIndex];
  var base = location.origin + location.pathname.replace(/[^/]*$/, "");
  window.open(base + "fenxiang-haibao.html?title=" + encodeURIComponent(e.name) + "&date=" + e.date, "_blank");
}

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(function () { prompt("复制链接:", text); });
  } else {
    prompt("复制链接:", text);
  }
}

function load() {
  try { events = JSON.parse(localStorage.getItem("customCountdowns") || "[]"); } catch (e) { events = []; }
  renderList();
  if (events.length > 0) showCountdown(0);
}

function save() {
  try { localStorage.setItem("customCountdowns", JSON.stringify(events)); } catch (e) {}
}

function useTpl(name) {
  document.getElementById("evName").value = name;
  document.getElementById("evDate").focus();
  alert("已填入「" + name + "」,请选择日期后点击添加");
}

function addEvent() {
  var name = document.getElementById("evName").value.trim();
  var date = document.getElementById("evDate").value;
  var time = document.getElementById("evTime").value || "00:00";
  var note = document.getElementById("evNote").value.trim();
  var start = document.getElementById("evStart").value || "";
  if (!name) { alert("请填写事件名称"); return; }
  if (!date) { alert("请选择日期"); return; }
  var dup = events.some(function (e) { return e.name === name && e.date === date && e.time === time; });
  if (dup) { alert("这个倒计时已经存在了"); return; }
  events.push({ name: name, date: date, time: time, note: note, start: start });
  save();
  renderList();
  showCountdown(events.length - 1);
  document.getElementById("evName").value = "";
  document.getElementById("evDate").value = "";
  document.getElementById("evNote").value = "";
  document.getElementById("evStart").value = "";
}

function quickAdd(name, date) {
  events.push({ name: name, date: date, time: "00:00", note: "", start: "" });
  save();
  renderList();
  showCountdown(events.length - 1);
}

function renderList() {
  var list = document.getElementById("list");
  var empty = document.getElementById("empty");
  list.innerHTML = "";
  if (events.length === 0) { empty.style.display = "block"; return; }
  empty.style.display = "none";
  events.forEach(function (e, i) {
    var d = daysLeft(e.date + "T" + (e.time || "00:00") + ":00");
    var div = document.createElement("div");
    div.className = "item";
    var dateText = e.date.split("-")[0] + "年" + parseInt(e.date.split("-")[1]) + "月" + parseInt(e.date.split("-")[2]) + "日";
    div.innerHTML =
      '<div class="info" onclick="showCountdown(' + i + ')">' +
        '<div class="n">' + escapeHtml(e.name) + "</div>" +
        (e.note ? '<div class="n" style="font-size:12px;color:#94a3b8;font-weight:400;">' + escapeHtml(e.note) + "</div>" : "") +
        '<div class="d">' + dateText + "</div>" +
      "</div>" +
      '<div class="item-actions">' +
        '<div class="days">' + d + "<small>天</small></div>" +
        '<button class="btn del" onclick="editEvent(' + i + ')">编辑</button>' +
        '<button class="btn del" onclick="dupEvent(' + i + ')">复制</button>' +
        '<button class="btn del" onclick="deleteEvent(' + i + ')">删除</button>' +
      "</div>";
    list.appendChild(div);
  });
}

function editEvent(i) {
  var e = events[i];
  var nn = prompt("修改名称:", e.name);
  if (nn === null) return;
  var nd = prompt("修改日期(YYYY-MM-DD):", e.date);
  if (!nd || !/^\d{4}-\d{2}-\d{2}$/.test(nd)) { alert("日期格式不对"); return; }
  var nt = prompt("修改时间(HH:MM):", e.time || "00:00");
  if (!nt) nt = "00:00";
  e.name = nn.trim() || e.name;
  e.date = nd;
  e.time = nt;
  save();
  renderList();
  showCountdown(i);
}

function dupEvent(i) {
  var e = events[i];
  events.splice(i + 1, 0, { name: e.name + "(副本)", date: e.date, time: e.time, note: e.note || "", start: e.start || "" });
  save();
  renderList();
}

function deleteEvent(i) {
  events.splice(i, 1);
  save();
  renderList();
  if (events.length === 0) {
    document.getElementById("countdownBox").style.display = "none";
    if (timer) clearInterval(timer);
  } else {
    showCountdown(Math.min(i, events.length - 1));
  }
}

function showCountdown(i) {
  if (timer) clearInterval(timer);
  curIndex = i;
  var e = events[i];
  var box = document.getElementById("countdownBox");
  box.style.display = "block";
  document.getElementById("cdName").textContent = e.name;
  document.getElementById("cdDate").textContent = e.date + " " + e.time;
  // 备考进度
  var pw = document.getElementById("progWrap");
  if (e.start) {
    var st = new Date(e.start + "T00:00:00").getTime();
    var tg = new Date(e.date + "T" + (e.time || "00:00") + ":00").getTime();
    var now = Date.now();
    var pct = tg > st ? Math.round((now - st) / (tg - st) * 100) : 0;
    pct = Math.max(0, Math.min(100, pct));
    document.getElementById("progPct").textContent = pct + "%";
    document.getElementById("progBar").style.width = pct + "%";
    pw.style.display = "block";
  } else {
    pw.style.display = "none";
  }
  timer = setInterval(function () { tick(e); }, 1000);
  tick(e);
}

function tick(e) {
  var target = new Date(e.date + "T" + (e.time || "00:00") + ":00");
  var diff = target - new Date();
  var days = Math.floor(diff / 86400000);
  var hours = Math.floor((diff % 86400000) / 3600000);
  var minutes = Math.floor((diff % 3600000) / 60000);
  var seconds = Math.floor((diff % 60000) / 1000);
  document.getElementById("cdDays").textContent = days >= 0 ? days : 0;
  var hide = document.getElementById("evHideHms") && document.getElementById("evHideHms").checked;
  var tr = document.getElementById("cdTimeRow");
  if (tr) tr.style.display = hide ? "none" : "";
  if (!hide) {
    document.getElementById("cdHours").textContent = String(hours < 0 ? 0 : hours).padStart(2, "0");
    document.getElementById("cdMinutes").textContent = String(minutes < 0 ? 0 : minutes).padStart(2, "0");
    document.getElementById("cdSeconds").textContent = String(seconds < 0 ? 0 : seconds).padStart(2, "0");
  }
}

function addToCalendar() {
  if (curIndex < 0 || !events[curIndex]) { alert("请先选择一个倒计时"); return; }
  var e = events[curIndex];
  var start = new Date(e.date + "T" + (e.time || "00:00") + ":00");
  var end = new Date(start.getTime() + 3600000);
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function fmtD(d) { return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + "T" + pad(d.getHours()) + pad(d.getMinutes()) + "00"; }
  var ics = "BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//daojishicn//CN\r\nBEGIN:VEVENT\r\nUID:" + Date.now() + "@daojishicn.top\r\nSUMMARY:" + e.name + "\r\nDTSTART:" + fmtD(start) + "\r\nDTEND:" + fmtD(end) + "\r\nDESCRIPTION:倒计时目标(daojishicn.top)\r\nEND:VEVENT\r\nEND:VCALENDAR";
  var blob = new Blob([ics], { type: "text/calendar" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "daojishi-" + e.date + ".ics";
  a.click();
  URL.revokeObjectURL(url);
  alert("已生成日历文件,打开后可加入手机/电脑日历");
}

function daysLeft(dateStr) {
  var diff = new Date(dateStr) - new Date();
  return diff > 0 ? Math.floor(diff / 86400000) : 0;
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function exportData() {
  if (events.length === 0) { alert("列表是空的,没有可导出的内容"); return; }
  var blob = new Blob([JSON.stringify(events, null, 2)], { type: "application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "dao-jishi-backup-" + new Date().toISOString().slice(0, 10) + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  alert("已导出!把这个文件发到其他设备(如手机),再点『导入列表』即可同步。");
}

function importData(input) {
  var file = input.files && input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function () {
    try {
      var data = JSON.parse(reader.result);
      if (!Array.isArray(data)) throw new Error("格式不对");
      var added = 0;
      data.forEach(function (e) {
        if (e && e.name && e.date) {
          var dup = events.some(function (x) { return x.name === e.name && x.date === e.date && x.time === e.time; });
          if (!dup) { events.push({ name: e.name, date: e.date, time: e.time || "00:00", note: e.note || "" }); added++; }
        }
      });
      save();
      renderList();
      if (events.length > 0) showCountdown(events.length - 1);
      alert(added > 0 ? "导入成功,新增 " + added + " 个倒计时!" : "没有新增(都已存在或文件格式不对)");
    } catch (err) {
      alert("导入失败:文件格式不正确,请确认是之前导出的文件");
    }
  };
  reader.readAsText(file);
  input.value = "";
}

load();
</script>
<script>
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
</script>
