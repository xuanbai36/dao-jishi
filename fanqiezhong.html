  <h1>番茄钟</h1>
  <div class="subtitle">25 分钟专注,5 分钟休息</div>

  <div class="glass">
    <div class="mode-bar">
      <button id="modeWork" class="active" onclick="setMode('work')">🍅 专注</button>
      <button id="modeBreak" onclick="setMode('break')">☕ 休息</button>
    </div>
    <div class="ring" id="ring">
      <div class="inner">
        <div class="timer" id="timer">25:00</div>
        <div class="state" id="state">专注中</div>
      </div>
    </div>
    <div class="controls">
      <button class="primary" id="startBtn" onclick="toggle()">开始</button>
      <button onclick="reset()">重置</button>
      <button class="danger" onclick="skip()">跳过</button>
    </div>
    <div class="settings" id="settings"></div>
  </div>

  <div class="glass tip">
    <h2 style="font-size:15px;color:#e2e8f0;margin-bottom:10px;">💡 番茄工作法</h2>
    <p><b>1 个番茄钟</b> = 25 分钟专注 + 5 分钟休息,每 4 个番茄钟后休息 15~30 分钟。</p>
    <p>专注期间<b>不做任何无关的事</b>(不看手机、不刷网页),倒计时结束后必须休息。每天记录完成几个番茄钟,就是你的专注时长。</p>
  </div>
  <div class="footer">番茄钟 · 免费使用</div>
</div>

<script>
var durations = { work: 25, break: 5 }; // 分钟
var presets = { work: [15, 25, 50], break: [5, 10, 15] };
var total = durations.work * 60;
var remain = total;
var running = false;
var mode = 'work';
var timer = null;

function renderSettings() {
  var box = document.getElementById("settings");
  box.innerHTML = "";
  presets[mode].forEach(function (m) {
    var b = document.createElement("button");
    b.textContent = m + " 分钟";
    if (m === durations[mode]) b.className = "active";
    b.onclick = function () { durations[mode] = m; total = m * 60; remain = total; renderSettings(); draw(); };
    box.appendChild(b);
  });
}

function setMode(m) {
  mode = m;
  document.getElementById("modeWork").className = m === 'work' ? 'active' : '';
  document.getElementById("modeBreak").className = m === 'break' ? 'active' : '';
  total = durations[m] * 60;
  remain = total;
  stop();
  document.getElementById("startBtn").textContent = "开始";
  document.getElementById("state").textContent = m === 'work' ? '专注中' : '休息中';
  renderSettings();
  draw();
}

function toggle() {
  if (running) { stop(); document.getElementById("startBtn").textContent = "继续"; }
  else {
    running = true;
    document.getElementById("startBtn").textContent = "暂停";
    timer = setInterval(function () {
      remain--;
      if (remain <= 0) { finish(); return; }
      draw();
    }, 1000);
    draw();
  }
}

function stop() { running = false; if (timer) clearInterval(timer); }

function reset() { stop(); remain = total; document.getElementById("startBtn").textContent = "开始"; draw(); }

function skip() {
  if (mode === 'work') {
    document.getElementById("state").textContent = "休息一下";
    new Audio().play ? null : null;
  }
  finish();
}

function finish() {
  stop();
  remain = 0; draw();
  document.getElementById("startBtn").textContent = "开始";
  if (mode === 'work') {
    document.getElementById("state").textContent = "专注结束 🎉";
    try { new Notification("番茄钟", { body: "专注结束,休息一下吧!" }); } catch (e) {}
    if (Notification && Notification.permission === "default") { try { Notification.requestPermission(); } catch (e) {} }
    setTimeout(function () { setMode('break'); }, 500);
  } else {
    document.getElementById("state").textContent = "休息结束";
    setTimeout(function () { setMode('work'); }, 500);
  }
}

function draw() {
  var m = Math.floor(remain / 60), s = remain % 60;
  document.getElementById("timer").textContent = (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  var pct = Math.max(0, Math.min(100, (total - remain) / total * 100));
  document.getElementById("ring").style.setProperty("--p", pct + "%");
}

renderSettings();
draw();
</script>
